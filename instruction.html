<!Doctype html>
<html>
<head>
    <title>Instuction page</title>
    <link rel="stylesheet" href="instructionstyle.css" />
</head>

<body>
    <div class="container">
        <button class="close"><img src="icons/delete.png" / alt="close"></button>
        <div class="instruction">
            <h2>Instructions </h2>
        </div>
        <div class="internal">
            <div class="details">
                <h3>Goal</h3>
                <p>Turn every off</p>
            </div>

                </div>
                <div class="function-button">
